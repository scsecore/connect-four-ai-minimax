<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four AI — Minimax Challenge</title>
    <meta name="description" content="Play Connect Four against an AI powered by the Minimax algorithm with Alpha-Beta pruning. Choose your difficulty and test your strategy!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1 class="title">
                <span class="title-icon">🔴🟡</span>
                Connect Four <span class="highlight">AI</span>
            </h1>
            <p class="subtitle">Minimax Algorithm with Alpha-Beta Pruning</p>
        </header>

        <!-- Controls Bar -->
        <div class="controls-bar glass-panel">
            <div class="difficulty-selector">
                <label for="difficulty-select">Difficulty</label>
                <div class="select-wrapper">
                    <select id="difficulty-select">
                        <option value="easy">🟢 Easy</option>
                        <option value="medium" selected>🟡 Medium</option>
                        <option value="hard">🔴 Hard</option>
                    </select>
                </div>
            </div>
            <button id="restart-btn" class="btn btn-restart">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                New Game
            </button>
        </div>

        <!-- Game Status -->
        <div id="game-status" class="game-status glass-panel">
            <div class="status-indicator player-turn"></div>
            <span id="status-text">Your turn — drop a red disc!</span>
        </div>

        <!-- Scoreboard -->
        <div class="scoreboard glass-panel">
            <div class="score-item player-score">
                <div class="score-disc red-disc-mini"></div>
                <div class="score-info">
                    <span class="score-label">You</span>
                    <span id="player-score" class="score-value">0</span>
                </div>
            </div>
            <div class="score-item draw-score">
                <div class="score-disc draw-disc-mini"></div>
                <div class="score-info">
                    <span class="score-label">Draws</span>
                    <span id="draw-score" class="score-value">0</span>
                </div>
            </div>
            <div class="score-item ai-score">
                <div class="score-disc yellow-disc-mini"></div>
                <div class="score-info">
                    <span class="score-label">AI</span>
                    <span id="ai-score" class="score-value">0</span>
                </div>
            </div>
        </div>

        <!-- Game Board -->
        <div class="board-wrapper">
            <!-- Column hover indicators -->
            <div class="column-indicators" id="column-indicators">
                <div class="col-indicator" data-col="0"></div>
                <div class="col-indicator" data-col="1"></div>
                <div class="col-indicator" data-col="2"></div>
                <div class="col-indicator" data-col="3"></div>
                <div class="col-indicator" data-col="4"></div>
                <div class="col-indicator" data-col="5"></div>
                <div class="col-indicator" data-col="6"></div>
            </div>

            <!-- Board Grid -->
            <div class="board" id="game-board">
                <!-- 6 rows × 7 columns generated by JS -->
            </div>
        </div>

        <!-- AI Thinking Overlay -->
        <div id="ai-thinking" class="ai-thinking hidden">
            <div class="thinking-spinner"></div>
            <span>AI is thinking…</span>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Built with Minimax + Alpha-Beta Pruning &nbsp;|&nbsp; Human vs AI</p>
        </footer>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
